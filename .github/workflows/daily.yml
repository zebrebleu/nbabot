# Analyse la prochaine nuit NBA 4 fois par jour et publie la page sur GitHub Pages.
# GitHub lance souvent ces tâches avec plusieurs heures de retard : d'où 4 passages.
# Heures en UTC. Paris = UTC+1 en hiver, UTC+2 en été.
#   08:13 UTC = 09:13 Paris (hiver)   13:43 UTC = 14:43
#   17:07 UTC = 18:07                 19:37 UTC = 20:37
# Dès qu'un match de la nuit a commencé, l'analyse affichée est figée.
name: Analyse NBA quotidienne

on:
  schedule:
    - cron: "13 8 * * *"
    - cron: "43 13 * * *"
    - cron: "7 17 * * *"
    - cron: "37 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-bot
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer l'analyse et générer la page
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py --html docs --no-save

      - name: Publier la page et l'historique des cotes
        run: |
          git config user.name "nba-bot"
          git config user.email "nba-bot@users.noreply.github.com"
          git add -f docs
          if [ -f data/odds_history.json ]; then git add -f data/odds_history.json; fi
          git diff --cached --quiet || git commit -m "Analyse du $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
