# Analyse NBA (4 fois par jour), tennis (2 fois) et foot (1 fois) et publie le site sur GitHub Pages.
# Heures en UTC. Paris = UTC+1 en hiver, UTC+2 en été.
#   08:13 UTC = 09:13 Paris -> NBA + tennis + foot
#   13:43 UTC = 14:43       -> NBA
#   17:07 UTC = 18:07       -> NBA + tennis
#   19:37 UTC = 20:37       -> NBA
# Lancement manuel (Run workflow) : tous les sports.
name: Analyse NBA quotidienne

on:
  schedule:
    - cron: "13 8 * * *"
    - cron: "43 13 * * *"
    - cron: "7 17 * * *"
    - cron: "37 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-bot
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Saisons terminées (NBA, tennis, foot, 3 ans) : téléchargées une fois puis conservées
      - name: Cache de l'historique
        uses: actions/cache@v4
        with:
          path: data/cache_long
          key: historique-${{ github.run_id }}
          restore-keys: historique-

      - name: Lancer l'analyse et générer le site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "13 8 * * *"|"") SPORT=all ;;
            "7 17 * * *") SPORT=nba,tennis ;;
            *) SPORT=nba ;;
          esac
          echo "Sports analysés : $SPORT"
          python main.py --sport "$SPORT" --html docs --no-save

      - name: Publier le site et l'historique
        if: always()
        run: |
          git config user.name "nba-bot"
          git config user.email "nba-bot@users.noreply.github.com"
          git add -f docs
          for f in data/odds_history.json data/tennis_odds_history.json data/tennis_diag.json \
                   data/foot_odds_history.json data/foot_diag.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          for f in data/tennis_bet.json data/foot_bet.json; do
            git rm -q --cached --ignore-unmatch "$f" 2>/dev/null || true
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          git diff --cached --quiet || git commit -m "Analyse du $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
